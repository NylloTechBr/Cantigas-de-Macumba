<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cantigas de Macumba</title>
  
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ==========================================
       VARIÁVEIS E TEMAS
       ========================================== */
    :root {
      --bg-dark: #0f0d0e;
      --bg-card: #181517;
      --bg-sidebar: #141113;
      --gold-primary: #d4af37;
      --gold-hover: #f3e5ab;
      --red-dark: #7a0010;
      --red-hover: #9e0015;
      --text-white: #f5f5f7;
      --text-muted: #a1a1aa;
      --border-color: #27272a;
      --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --font-title: 'Cinzel', serif;
      --font-body: 'Inter', sans-serif;
      --base-font-size: 16px;
    }

    [data-theme="light"] {
      --bg-dark: #f8f9fa;
      --bg-card: #ffffff;
      --bg-sidebar: #f1f3f5;
      --text-white: #1a1a1a;
      --text-muted: #6c757d;
      --border-color: #dee2e6;
      --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
    }

    /* RESET & BASE */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: var(--base-font-size);
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: var(--font-body);
      display: flex;
      height: 100vh;
      overflow: hidden;
      transition: var(--transition);
    }

    button, input, select, textarea {
      font-family: inherit;
      color: inherit;
      outline: none;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-dark);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--gold-primary);
    }

    /* LAYOUT PRINCIPAL */
    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: var(--transition);
      z-index: 100;
    }

    .brand {
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand i {
      color: var(--gold-primary);
      font-size: 1.8rem;
    }

    .brand h1 {
      font-family: var(--font-title);
      font-size: 1.1rem;
      color: var(--gold-primary);
      letter-spacing: 1px;
    }

    .nav-menu {
      list-style: none;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .nav-item button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 8px;
      color: var(--text-muted);
      font-weight: 500;
      transition: var(--transition);
    }

    .nav-item button:hover,
    .nav-item.active button {
      background-color: rgba(212, 175, 55, 0.1);
      color: var(--gold-primary);
    }

    .nav-item.active button {
      border-left: 3px solid var(--gold-primary);
    }

    /* Status do Firebase na Sidebar */
    .cloud-status {
      padding: 16px;
      border-top: 1px solid var(--border-color);
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #2e7d32;
    }

    /* Header & Main Area */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      height: 70px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      background-color: var(--bg-sidebar);
    }

    .menu-toggle {
      display: none;
      font-size: 1.4rem;
      color: var(--text-white);
    }

    .search-bar {
      position: relative;
      width: 320px;
    }

    .search-bar input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      background-color: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      color: var(--text-white);
      transition: var(--transition);
    }

    .search-bar input:focus {
      border-color: var(--gold-primary);
    }

    .search-bar i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .main-content {
      flex: 1;
      padding: 32px;
      overflow-y: auto;
      background-color: var(--bg-dark);
    }

    /* COMPONENTES REUTILIZÁVEIS */
    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
    }

    .btn-primary {
      background-color: var(--gold-primary);
      color: #000;
    }
    .btn-primary:hover {
      background-color: var(--gold-hover);
      transform: translateY(-2px);
    }

    .btn-danger {
      background-color: var(--red-dark);
      color: #fff;
    }
    .btn-danger:hover {
      background-color: var(--red-hover);
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-white);
    }
    .btn-secondary:hover {
      background-color: var(--border-color);
    }

    .page-title {
      font-family: var(--font-title);
      font-size: 1.8rem;
      color: var(--gold-primary);
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    /* Cards */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--card-shadow);
      border-color: rgba(212, 175, 55, 0.4);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .card-subtitle {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .tag {
      background-color: rgba(212, 175, 55, 0.15);
      color: var(--gold-primary);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    /* DASHBOARD / ESTATÍSTICAS */
    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .stat-icon {
      font-size: 2rem;
      color: var(--gold-primary);
    }

    .stat-val {
      font-size: 1.6rem;
      font-weight: 700;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* MODAIS */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: var(--transition);
      backdrop-filter: blur(4px);
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px;
      box-shadow: var(--card-shadow);
      transform: translateY(20px);
      transition: var(--transition);
    }

    .modal-overlay.active .modal {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .form-control {
      width: 100%;
      padding: 12px;
      background-color: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-white);
      transition: var(--transition);
    }

    .form-control:focus {
      border-color: var(--gold-primary);
    }

    textarea.form-control {
      min-height: 120px;
      resize: vertical;
    }

    /* VISUALIZADOR DE CANTIGA */
    .cantiga-view {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 32px;
      max-width: 800px;
      margin: 0 auto;
    }

    .cantiga-lyric {
      font-size: 1.15rem;
      line-height: 1.8;
      white-space: pre-wrap;
      margin: 24px 0;
      padding: 20px;
      background-color: var(--bg-dark);
      border-radius: 8px;
      border-left: 4px solid var(--gold-primary);
    }

    /* ESTILO DE IMPRESSÃO / EXPORTAÇÃO PDF */
    @media print {
      body * {
        visibility: hidden;
      }
      #print-section, #print-section * {
        visibility: visible;
      }
      #print-section {
        position: absolute;
        left: 0; top: 0;
        width: 100%;
        color: #000 !important;
        background: #fff !important;
        padding: 20px;
      }
      .pdf-cantiga-item {
        page-break-inside: avoid;
        margin-bottom: 24px;
        border-bottom: 1px solid #ccc;
        padding-bottom: 16px;
      }
      .pdf-cantiga-title {
        font-size: 1.4rem;
        font-weight: bold;
        color: #000;
        margin-bottom: 8px;
      }
      .pdf-cantiga-lyrics {
        white-space: pre-wrap;
        font-size: 1.05rem;
        line-height: 1.5;
        color: #111;
      }
    }

    /* RESPONSIVIDADE */
    @media (max-width: 768px) {
      .sidebar {
        position: absolute;
        left: -260px;
        height: 100%;
      }
      .sidebar.open {
        left: 0;
      }
      .menu-toggle {
        display: block;
      }
      .header {
        padding: 0 16px;
      }
      .search-bar {
        width: 180px;
      }
      .main-content {
        padding: 16px;
      }
      .grid-cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <i class="fa-solid fa-fire-flame-curved"></i>

  <!-- AREA RESERVADA PARA IMPRESSÃO / GERAR PDF -->
  <div id="print-section"></div>

  <!-- MODAL CATEGORIA -->
  <div class="modal-overlay" id="modalCategory">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalCatTitle" style="color: var(--gold-primary);">Nova Categoria / Subcategoria</h3>

          <select id="catParentId" class="form-control">

          </select>

        <div class="form-group">
          <label>Ícone</label>
<select id="catIcon" class="form-control">

  <!-- MODAL CANTIGA (EDITOR) -->
  <div class="modal-overlay" id="modalCantiga">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalCantigaTitle" style="color: var(--gold-primary);">Novo Ponto</h3>
        <button class="close-modal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="formCantiga">
        <input type="hidden" id="cantigaId">

          <label>Título do Ponto</label>
          <input type="text" id="cantigaTitle" class="form-control" required placeholder="Ex: Ponto de Ogum">
        </div>

          <label>Categoria / Subcategoria</label>
          <select id="cantigaCategory" class="form-control" required>

          <button type="submit" class="btn btn-primary">Salvar Ponto</button>
        </div>
      </form>
    </div>
  </div>

  <!-- FIREBASE IMPORTS (MÓDULOS ESM) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, remove, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Configuração do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAAW59AXhb8N6sJMXxuExF1sfuoxLa6As4",
      authDomain: "meu-escritorio-8c82e.firebaseapp.com",
      databaseURL: "https://meu-escritorio-8c82e-default-rtdb.firebaseio.com",
      projectId: "meu-escritorio-8c82e",
      storageBucket: "meu-escritorio-8c82e.firebasestorage.app",
      messagingSenderId: "684347838633",
      appId: "1:684347838633:web:2d92465d0a37ea185b19b8"
    };

    // Inicialização do Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    /* ==========================================
       ESTADO GLOBAL DA APLICAÇÃO
       ========================================== */
    let state = {
      categories: [],
      cantigas: [],
      settings: JSON.parse(localStorage.getItem('umbanda_settings')) || { theme: 'dark', fontSize: '16px', mainColor: '#d4af37' },
      currentPage: 'home',
      currentCategoryFilter: null,
      currentCantigaId: null,
      searchTerm: ''
    };

    /* ==========================================
       CONEXÃO EM TEMPO REAL (FIREBASE LISTENERS)
       ========================================== */
    const categoriesRef = ref(db, 'categories');
    const cantigasRef = ref(db, 'cantigas');

    // Escutar Categorias
    onValue(categoriesRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        state.categories = Object.keys(data).map(key => ({
          id: key,
          name: data[key].name || '',
          parentId: data[key].parentId || null,
          icon: data[key].icon || 'fa-fire',
          color: data[key].color || '#d4af37'
        }));
      } else {
        state.categories = [];
      }
      render();
    });

    // Escutar Cantigas
    onValue(cantigasRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        state.cantigas = Object.keys(data).map(key => ({ id: key, ...data[key] }));
      } else {
        state.cantigas = [];
      }
      render();
    });

    /* ==========================================
       UTILITÁRIOS & CONFIGURAÇÕES
       ========================================== */
    function applySettings() {
      document.body.setAttribute('data-theme', state.settings.theme);
      document.documentElement.style.setProperty('--base-font-size', state.settings.fontSize);
      if (state.settings.mainColor) {
        document.documentElement.style.setProperty('--gold-primary', state.settings.mainColor);
      }
      localStorage.setItem('umbanda_settings', JSON.stringify(state.settings));
    }

    function formatDate(isoString) {
      if(!isoString) return '';
      const date = new Date(isoString);
      return date.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function getCantigaCategoryName(catId) {
      const cat = state.categories.find(c => c.id === catId);
      if(!cat) return 'Sem Categoria';
      if(cat.parentId) {
        const parent = state.categories.find(c => c.id === cat.parentId);
        return parent ? `${parent.name} / ${cat.name}` : cat.name;
      }
      return cat.name;
    }

    /* ==========================================
       NAVEGAÇÃO E RENDERIZAÇÃO
       ========================================== */
    window.navigateTo = function(page, categoryId = null) {
      state.currentPage = page;
      state.currentCategoryFilter = categoryId;
      
      document.querySelectorAll('.nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.page === page);
      });

      render();
    };

    const mainContent = document.getElementById('mainContent');

    function render() {
      applySettings();

      if (state.searchTerm.trim() !== '') {
        renderSearchResults();
        return;
      }

      switch (state.currentPage) {
        case 'home': renderHome(); break;
        case 'categories': renderCategories(); break;
        case 'category-detail': renderCategoryDetail(state.currentCategoryFilter); break;
        case 'favorites': renderFavorites(); break;
        case 'recents': renderRecents(); break;
        case 'backup': renderBackup(); break;
        case 'settings': renderSettings(); break;
        case 'view-cantiga': renderCantigaView(state.currentCantigaId); break;
        default: renderHome();
      }
    }

    // --- HOME ---
    function renderHome() {
      const totalCategories = state.categories.length;
      const totalCantigas = state.cantigas.length;
      const lastCantiga = state.cantigas.length > 0 
        ? [...state.cantigas].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt))[0] 
        : null;

      const mainCategories = state.categories.filter(c => !c.parentId);

      mainContent.innerHTML = `
        <div class="page-title">
          <h2>Início</h2>
          <button class="btn btn-primary" onclick="openModalCategory()"><i class="fa-solid fa-folder-plus"></i> Nova Categoria</button>
        </div>

        <div class="stats-container">
          <div class="stat-card">
            <i class="fa-solid fa-layer-group stat-icon"></i>
            <div>
              <div class="stat-val">${totalCategories}</div>
              <div class="stat-label">Categorias / Subcategorias</div>
            </div>
          </div>
          <div class="stat-card">
            <i class="fa-solid fa-music stat-icon"></i>
            <div>
              <div class="stat-val">${totalCantigas}</div>
              <div class="stat-label">Cantigas Registradas</div>
            </div>
          </div>
          <div class="stat-card">
            <i class="fa-solid fa-clock-rotate-left stat-icon"></i>
            <div>
              <div class="stat-val" style="font-size:1rem; font-weight:600;">${lastCantiga ? lastCantiga.title : 'Nenhuma'}</div>
              <div class="stat-label">Última Adicionada</div>
            </div>
          </div>
        </div>

        <h3 style="margin-bottom: 16px; font-family: var(--font-title); color: var(--gold-primary);">Categorias Principais</h3>
        ${mainCategories.length === 0 ? '<p style="color: var(--text-muted);">Nenhuma categoria cadastrada.</p>' : ''}
        <div class="grid-cards">
          ${mainCategories.map(cat => renderCategoryCardHtml(cat)).join('')}
        </div>
      `;
    }

    // --- CATEGORIAS ---
    function renderCategories() {
      const mainCategories = state.categories.filter(c => !c.parentId);

      mainContent.innerHTML = `
        <div class="page-title">
          <h2>Categorias</h2>
          <button class="btn btn-primary" onclick="openModalCategory()"><i class="fa-solid fa-plus"></i> Nova Categoria / Subcategoria</button>
        </div>
        ${mainCategories.length === 0 ? '<p style="color: var(--text-muted);">Nenhuma categoria cadastrada.</p>' : ''}
        <div class="grid-cards">
          ${mainCategories.map(cat => renderCategoryCardHtml(cat)).join('')}
        </div>
      `;
    }

    function renderCategoryCardHtml(cat) {
      const subCatIds = state.categories.filter(c => c.parentId === cat.id).map(c => c.id);
      const allCatIds = [cat.id, ...subCatIds];
      const count = state.cantigas.filter(c => allCatIds.includes(c.categoryId)).length;
      const subCount = subCatIds.length;

      return `
        <div class="card" onclick="navigateTo('category-detail', '${cat.id}')">
          <div>
            <div class="card-header">
              <div class="card-icon" style="background-color: ${cat.color}20; color: ${cat.color};">
                <i class="fa-solid ${cat.icon}"></i>
              </div>
              <div onclick="event.stopPropagation();">
                <button onclick="editCategory('${cat.id}')" style="color: var(--text-muted); margin-right: 8px;"><i class="fa-solid fa-pen"></i></button>
                <button onclick="deleteCategory('${cat.id}')" style="color: var(--red-dark);"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>
            <div class="card-title">${cat.name}</div>
            <div class="card-subtitle">
              ${count} cantigas ${subCount > 0 ? `• ${subCount} subcategorias` : ''}
            </div>
          </div>
        </div>
      `;
    }

    // --- DETALHE DA CATEGORIA E SUBCATEGORIAS ---
    function renderCategoryDetail(catId) {
      const category = state.categories.find(c => c.id === catId);
      if(!category) return navigateTo('categories');

      const subcategories = state.categories.filter(c => c.parentId === catId);
      const cantigas = state.cantigas.filter(c => c.categoryId === catId);

      mainContent.innerHTML = `
        <div class="page-title">
          <div style="display:flex; align-items:center; gap:12px;">
            <i class="fa-solid ${category.icon}" style="color: ${category.color}"></i>
            <h2>${category.name}</h2>
          </div>
          <div style="display:flex; gap:10px;">
            <button class="btn btn-secondary" onclick="exportCategoryToPDF('${catId}')"><i class="fa-solid fa-file-pdf"></i> Exportar PDF</button>
            <button class="btn btn-secondary" onclick="openModalCategory('${catId}', true)"><i class="fa-solid fa-plus"></i> Nova Subcategoria</button>
            <button class="btn btn-primary" onclick="openModalCantiga('${catId}')"><i class="fa-solid fa-plus"></i> Adicionar Ponto</button>
          </div>
        </div>

        ${subcategories.length > 0 ? `
          <h3 style="margin-bottom: 16px; font-family: var(--font-title); color: var(--gold-primary);">Subcategorias de ${category.name}</h3>

    // --- CARD DA CANTIGA ---
    function renderCantigaCardHtml(cantiga) {
      const isFav = cantiga.favorite;
      return `
        <div class="card" onclick="viewCantiga('${cantiga.id}')">
          <div>
            <div class="card-header">
              <span class="tag">${getCantigaCategoryName(cantiga.categoryId)}</span>
              <button onclick="event.stopPropagation(); toggleFavorite('${cantiga.id}')" style="color: ${isFav ? 'var(--gold-primary)' : 'var(--text-muted)'}">

          </div>

            <div>
              <button onclick="duplicateCantiga('${cantiga.id}')" title="Duplicar" style="color: var(--text-muted); margin-right: 8px;"><i class="fa-solid fa-copy"></i></button>
              <button onclick="editCantiga('${cantiga.id}')" title="Editar" style="color: var(--text-muted); margin-right: 8px;"><i class="fa-solid fa-pen"></i></button>
              <button onclick="deleteCantiga('${cantiga.id}')" title="Excluir" style="color: var(--red-dark);"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        </div>
      `;
    }

    // --- FAVORITOS ---
    function renderFavorites() {
      const favs = state.cantigas.filter(c => c.favorite);
      mainContent.innerHTML = `
        <div class="page-title">
          <h2>Pontos Favoritos</h2>
        </div>
        ${favs.length === 0 ? '<p style="color: var(--text-muted);">Nenhum ponto marcado como favorito.</p>' : ''}
        <div class="grid-cards">
          ${favs.map(c => renderCantigaCardHtml(c)).join('')}
        </div>
      `;
    }

    // --- RECENTES ---
    function renderRecents() {
      const recents = [...state.cantigas].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 10);
      mainContent.innerHTML = `
        <div class="page-title">
          <h2>Adicionados Recentemente</h2>
        </div>
        ${recents.length === 0 ? '<p style="color: var(--text-muted);">Nenhum ponto cadastrado.</p>' : ''}
        <div class="grid-cards">
          ${recents.map(c => renderCantigaCardHtml(c)).join('')}
        </div>
      `;
    }

    // --- VISUALIZAR CANTIGA ---
    function renderCantigaView(cantigaId) {
      const cantiga = state.cantigas.find(c => c.id === cantigaId);
      if(!cantiga) return navigateTo('home');

      mainContent.innerHTML = `
        <div class="cantiga-view">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 16px;">
            <div>
              <span class="tag">${getCantigaCategoryName(cantiga.categoryId)}</span>
              <h2 style="font-family: var(--font-title); color: var(--gold-primary); font-size: 2rem; margin-top: 8px;">${cantiga.title}</h2>
            </div>
            <button onclick="toggleFavorite('${cantiga.id}')" style="font-size: 1.5rem; color: ${cantiga.favorite ? 'var(--gold-primary)' : 'var(--text-muted)'}">

            </button>

              ${cantiga.tags.map(t => `<span style="background: var(--border-color); font-size:0.75rem; padding: 2px 8px; border-radius: 12px;">#${t.trim()}</span>`).join('')}

          <div style="display:flex; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--border-color); padding-top: 20px;">
            <button class="btn btn-primary" onclick="editCantiga('${cantiga.id}')"><i class="fa-solid fa-pen"></i> Editar</button>
            <button class="btn btn-secondary" onclick="copyToClipboard(\`${cantiga.lyrics.replace(/`/g, '\\`')}\`)"><i class="fa-solid fa-copy"></i> Copiar Letra</button>
            <button class="btn btn-secondary" onclick="printCantiga('${cantiga.id}')"><i class="fa-solid fa-print"></i> Imprimir</button>
            <button class="btn btn-secondary" onclick="shareCantiga('${cantiga.id}')"><i class="fa-solid fa-share-nodes"></i> Compartilhar</button>
          </div>
        </div>
      `;
    }

    // --- PESQUISA ---
    function renderSearchResults() {
      const term = state.searchTerm.toLowerCase();
      const results = state.cantigas.filter(c => 
        c.title.toLowerCase().includes(term) || 
        c.lyrics.toLowerCase().includes(term) ||
        (c.tags && c.tags.some(t => t.toLowerCase().includes(term)))
      );

      mainContent.innerHTML = `
        <div class="page-title">
          <h2>Resultados da Busca ("${state.searchTerm}")</h2>
        </div>
        ${results.length === 0 ? '<p style="color: var(--text-muted);">Nenhum ponto encontrado para este termo.</p>' : ''}
        <div class="grid-cards">
          ${results.map(c => renderCantigaCardHtml(c)).join('')}
        </div>
      `;
    }

    // --- BACKUP ---
    function renderBackup() {
      mainContent.innerHTML = `
        <div class="page-title">
          <h2>Backup e Restauração</h2>
        </div>
        <div class="cantiga-view">
          <p style="margin-bottom: 20px; color: var(--text-muted);">Baixe uma cópia de segurança do Firebase ou restaure dados através de um arquivo JSON.</p>
          
          <div style="display:flex; flex-direction:column; gap: 16px;">
            <div>
              <h3>Exportar Dados (JSON)</h3>
              <p style="font-size:0.85rem; color: var(--text-muted); margin-bottom: 8px;">Baixe um arquivo JSON contendo todas as suas categorias e cantigas do banco em nuvem.</p>
              <button class="btn btn-primary" onclick="exportData()"><i class="fa-solid fa-download"></i> Baixar Backup JSON</button>
            </div>

            <hr style="border-color: var(--border-color);">

            <div>
              <h3>Importar Dados (JSON)</h3>
              <p style="font-size:0.85rem; color: var(--text-muted); margin-bottom: 8px;">Importe um arquivo JSON para enviar dados em massa ao seu Firebase Realtime Database.</p>
              <input type="file" id="importFile" accept=".json" style="display:none;">
              <button class="btn btn-secondary" id="btnTriggerImport"><i class="fa-solid fa-upload"></i> Selecionar Arquivo JSON</button>

          </div>
        </div>

      document.getElementById('btnTriggerImport').addEventListener('click', () => {

      });

      document.getElementById('importFile').addEventListener('change', importData);

    // --- CONFIGURAÇÕES ---
    function renderSettings() {
      mainContent.innerHTML = `
        <div class="page-title">
          <h2>Configurações do Sistema</h2>
        </div>
        <div class="cantiga-view">
          <div class="form-group">
            <label>Tema Visual</label>
            <select class="form-control" id="themeSelect">
              <option value="dark" ${state.settings.theme === 'dark' ? 'selected' : ''}>Modo Escuro (Padrão)</option>
              <option value="light" ${state.settings.theme === 'light' ? 'selected' : ''}>Modo Claro</option>
            </select>

          <div class="form-group">
            <label>Tamanho da Fonte das Cantigas</label>
            <select class="form-control" id="fontSizeSelect">

              <option value="16px" ${state.settings.fontSize === '16px' ? 'selected' : ''}>Média (Padrão)</option>
              <option value="18px" ${state.settings.fontSize === '18px' ? 'selected' : ''}>Grande</option>
              <option value="20px" ${state.settings.fontSize === '20px' ? 'selected' : ''}>Extra Grande</option>
            </select>
          </div>

          <div class="form-group">
            <label>Cor Principal de Destaque</label>
            <input type="color" class="form-control" id="colorPicker" value="${state.settings.mainColor || '#d4af37'}" style="height: 40px; padding:2px;">
          </div>

          <hr style="border-color: var(--border-color); margin: 24px 0;">

          <div style="border: 1px solid var(--red-dark); padding: 16px; border-radius: 8px; background-color: rgba(122, 0, 16, 0.1);">
            <h4 style="color: var(--red-hover); margin-bottom: 8px;">Zona de Perigo</h4>
            <p style="font-size:0.85rem; color: var(--text-muted); margin-bottom: 12px;">Esta ação limpa permanentemente todos os dados armazenados no banco de dados Firebase.</p>
            <button class="btn btn-danger" onclick="clearAllData()"><i class="fa-solid fa-triangle-exclamation"></i> Limpar Banco Firebase</button>
          </div>

      `;

      document.getElementById('themeSelect').addEventListener('change', (e) => updateSetting('theme', e.target.value));
      document.getElementById('fontSizeSelect').addEventListener('change', (e) => updateSetting('fontSize', e.target.value));
      document.getElementById('colorPicker').addEventListener('change', (e) => updateSetting('mainColor', e.target.value));

    /* ==========================================
       OPERAÇÕES FIREBASE (CRUD) & EXPORTAÇÃO PDF
       ========================================== */

    // MODAL CATEGORIA (CORRIGIDO)
    const modalCategory = document.getElementById('modalCategory');
    window.openModalCategory = function(catId = null, isSubcategoryOf = false) {
      const form = document.getElementById('formCategory');
      form.reset();
      
      const parentSelect = document.getElementById('catParentId');
      
      // 1. Descobrir qual deve ser o ID pai pré-selecionado
      let selectedParentId = "";
      if (catId && isSubcategoryOf) {
        selectedParentId = catId; // Criando subcategoria DENTRO da categoria atual
      } else if (catId && !isSubcategoryOf) {
        const currentCat = state.categories.find(c => c.id === catId);
        selectedParentId = currentCat ? (currentCat.parentId || "") : "";
      }

      // 2. Montar as opções com TODAS as categorias ativas (evitando auto-referência na edição)
      let optionsHTML = `<option value="">Nenhuma (Categoria Principal)</option>`;
      
      state.categories.forEach(c => {
        // Não permite que uma categoria seja pai dela mesma ao editar
        if (!isSubcategoryOf && c.id === catId) return;

        // Se for subcategoria, adiciona um recuo visual "— "
        const prefix = c.parentId ? "— " : "";
        optionsHTML += `<option value="${c.id}">${prefix}${c.name}</option>`;
      });

      parentSelect.innerHTML = optionsHTML;

      // 3. Preencher o formulário conforme o contexto
      if (catId && !isSubcategoryOf) {
        // Modo Edição
        const cat = state.categories.find(c => c.id === catId);
        document.getElementById('catId').value = cat.id;
        document.getElementById('catName').value = cat.name;
        document.getElementById('catParentId').value = selectedParentId;
        document.getElementById('catIcon').value = cat.icon || 'fa-fire';
        document.getElementById('catColor').value = cat.color || '#d4af37';
        document.getElementById('modalCatTitle').innerText = 'Editar Categoria';
      } else if (catId && isSubcategoryOf) {
        // Modo Nova Subcategoria
        document.getElementById('catId').value = '';
        document.getElementById('catParentId').value = selectedParentId;
        document.getElementById('modalCatTitle').innerText = 'Nova Subcategoria';
      } else {
        // Criar do zero
        document.getElementById('catId').value = '';
        document.getElementById('catParentId').value = '';
        document.getElementById('modalCatTitle').innerText = 'Nova Categoria';
      }

      modalCategory.classList.add('active');
    };

    document.getElementById('formCategory').addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('catId').value;
      const name = document.getElementById('catName').value;
      const parentId = document.getElementById('catParentId').value || null; // Força null caso venha string vazia
      const icon = document.getElementById('catIcon').value;
      const color = document.getElementById('catColor').value;

      const categoryData = { name, icon, color };
      if (parentId) {
        categoryData.parentId = parentId;
      }

      if(id) {
        if (!parentId) {
          categoryData.parentId = null;
        }
        update(ref(db, `categories/${id}`), categoryData);
      } else {
        const newRef = push(ref(db, 'categories'));
        set(newRef, categoryData);
      }

      modalCategory.classList.remove('active');
    });

    window.editCategory = function(id) { openModalCategory(id); };
    
    window.deleteCategory = function(id) {
      if(confirm('Tem certeza? Isso excluirá a categoria do Firebase.')) {
        remove(ref(db, `categories/${id}`));
      }
    };

    // EXPORTAR CATEGORIA EM PDF
    window.exportCategoryToPDF = function(catId) {
      const category = state.categories.find(c => c.id === catId);
      if(!category) return;

      const subCatIds = state.categories.filter(c => c.parentId === catId).map(c => c.id);
      const allCatIds = [catId, ...subCatIds];
      const cantigas = state.cantigas.filter(c => allCatIds.includes(c.categoryId));

      if(cantigas.length === 0) {
        alert("Não há cantigas nesta categoria para exportar.");
        return;
      }

      const printArea = document.getElementById('print-section');
      
      let html = `
        <div style="text-align: center; margin-bottom: 30px;">
          <h1 style="font-size: 2.2rem; margin-bottom: 5px;">Cancioneiro de Umbanda</h1>
          <h2 style="font-size: 1.5rem; color: #555;">Categoria: ${category.name}</h2>
          <p style="font-size: 0.9rem; color: #777;">Gerado em ${new Date().toLocaleDateString('pt-BR')}</p>
        </div>
        <hr style="margin-bottom: 20px;">
      `;

      cantigas.forEach(c => {
        html += `
          <div class="pdf-cantiga-item">
            <div class="pdf-cantiga-title">${c.title} <span style="font-size: 0.8rem; font-weight: normal; color: #666;">(${getCantigaCategoryName(c.categoryId)})</span></div>
            <div class="pdf-cantiga-lyrics">${c.lyrics}</div>
            ${c.notes ? `<div style="font-style: italic; font-size: 0.85rem; color: #555; margin-top: 6px;">Obs: ${c.notes}</div>` : ''}
          </div>
        `;
      });

      printArea.innerHTML = html;
      window.print();
    };

    // MODAL CANTIGA / EDITOR
    const modalCantiga = document.getElementById('modalCantiga');
    window.openModalCantiga = function(defaultCatId = null, cantigaId = null) {
      if(state.categories.length === 0) {
        alert('Crie ao menos uma categoria antes de adicionar um ponto.');
        openModalCategory();
        return;
      }

      const form = document.getElementById('formCantiga');
      form.reset();
      
      const select = document.getElementById('cantigaCategory');
      select.innerHTML = state.categories.map(c => `<option value="${c.id}">${getCantigaCategoryName(c.id)}</option>`).join('');

      if(cantigaId) {
        const cantiga = state.cantigas.find(c => c.id === cantigaId);
        document.getElementById('cantigaId').value = cantiga.id;
        document.getElementById('cantigaTitle').value = cantiga.title;
        document.getElementById('cantigaCategory').value = cantiga.categoryId;
        document.getElementById('cantigaTags').value = cantiga.tags ? cantiga.tags.join(', ') : '';
        document.getElementById('cantigaLyrics').value = cantiga.lyrics;
        document.getElementById('cantigaNotes').value = cantiga.notes || '';
        document.getElementById('modalCantigaTitle').innerText = 'Editar Ponto';
      } else {
        document.getElementById('cantigaId').value = '';
        if(defaultCatId) document.getElementById('cantigaCategory').value = defaultCatId;
        document.getElementById('modalCantigaTitle').innerText = 'Novo Ponto';
      }

      updateCharCounter();
      modalCantiga.classList.add('active');
    };

    document.getElementById('cantigaLyrics').addEventListener('input', updateCharCounter);
    function updateCharCounter() {
      const len = document.getElementById('cantigaLyrics').value.length;
      document.getElementById('charCounter').innerText = len;
    }

    document.getElementById('formCantiga').addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('cantigaId').value;
      const title = document.getElementById('cantigaTitle').value;
      const categoryId = document.getElementById('cantigaCategory').value;
      const tagsStr = document.getElementById('cantigaTags').value;
      const lyrics = document.getElementById('cantigaLyrics').value;
      const notes = document.getElementById('cantigaNotes').value;

      const tags = tagsStr ? tagsStr.split(',').map(t => t.trim()).filter(t => t !== '') : [];

      if(id) {
        update(ref(db, `cantigas/${id}`), {
          title,
          categoryId,
          tags,
          lyrics,
          notes,
          updatedAt: new Date().toISOString()
        });
      } else {
        const newRef = push(ref(db, 'cantigas'));
        set(newRef, {
          title,
          categoryId,
          tags,
          lyrics,
          notes,
          favorite: false,
          createdAt: new Date().toISOString()
        });
      }

      modalCantiga.classList.remove('active');
    });

    window.editCantiga = function(id) { openModalCantiga(null, id); };
    
    window.deleteCantiga = function(id) {
      if(confirm('Tem certeza que deseja excluir esta cantiga do Firebase?')) {
        remove(ref(db, `cantigas/${id}`));
        if(state.currentPage === 'view-cantiga') navigateTo('home');
      }
    };

    window.duplicateCantiga = function(id) {
      const item = state.cantigas.find(c => c.id === id);
      if(item) {
        const newRef = push(ref(db, 'cantigas'));
        set(newRef, {
          title: `${item.title} (Cópia)`,
          categoryId: item.categoryId,
          tags: item.tags || [],
          lyrics: item.lyrics,
          notes: item.notes || '',
          favorite: false,
          createdAt: new Date().toISOString()
        });
      }
    };

    window.toggleFavorite = function(id) {
      const cantiga = state.cantigas.find(c => c.id === id);
      if(cantiga) {
        update(ref(db, `cantigas/${id}`), {
          favorite: !cantiga.favorite
        });
      }
    };

    window.viewCantiga = function(id) {
      state.currentCantigaId = id;
      navigateTo('view-cantiga');
    };

    // AÇÕES AUXILIARES
    window.copyToClipboard = function(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert('Letra copiada para a área de transferência!');
      });
    };

    window.printCantiga = function(id) {
      const cantiga = state.cantigas.find(c => c.id === id);
      if(!cantiga) return;

      const printArea = document.getElementById('print-section');
      printArea.innerHTML = `
        <h1>${cantiga.title}</h1>
        <p><strong>Categoria:</strong> ${getCantigaCategoryName(cantiga.categoryId)}</p>
        <hr style="margin: 12px 0;">
        <div class="cantiga-lyric">${cantiga.lyrics}</div>
        ${cantiga.notes ? `<p><em>${cantiga.notes}</em></p>` : ''}
      `;
      window.print();
    };

    window.shareCantiga = function(id) {
      const cantiga = state.cantigas.find(c => c.id === id);
      if(navigator.share && cantiga) {
        navigator.share({
          title: cantiga.title,
          text: `${cantiga.title}\n\n${cantiga.lyrics}`
        }).catch(() => {});
      } else {
        copyToClipboard(`${cantiga.title}\n\n${cantiga.lyrics}`);
      }
    };

    // BACKUP E CONFIGURAÇÕES
    window.exportData = function() {
      const exportObject = {
        categories: state.categories,
        cantigas: state.cantigas
      };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObject, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `firebase_cancioneiro_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    };

    function importData(event) {
      const file = event.target.files[0];
      if(!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if(imported.categories && imported.cantigas) {
            
            // Atualizar Categorias no Firebase
            imported.categories.forEach(cat => {
              const catRef = ref(db, `categories/${cat.id || push(ref(db, 'categories')).key}`);
              set(catRef, { name: cat.name, parentId: cat.parentId || null, icon: cat.icon, color: cat.color });
            });

            // Atualizar Cantigas no Firebase
            imported.cantigas.forEach(cant => {
              const cantRef = ref(db, `cantigas/${cant.id || push(ref(db, 'cantigas')).key}`);
              set(cantRef, {
                title: cant.title,
                categoryId: cant.categoryId,
                tags: cant.tags || [],
                lyrics: cant.lyrics,
                notes: cant.notes || '',
                favorite: !!cant.favorite,
                createdAt: cant.createdAt || new Date().toISOString()
              });
            });

            alert('Dados importados com sucesso para o Firebase!');
            navigateTo('home');
          } else {
            alert('Arquivo JSON com estrutura inválida.');
          }
        } catch(err) {
          alert('Erro ao processar o arquivo JSON.');
        }
      };
      reader.readAsText(file);
    }

    function updateSetting(key, val) {
      state.settings[key] = val;
      applySettings();
    }

    window.clearAllData = function() {
      if(confirm('ATENÇÃO: Esta ação apaga permanentemente TODAS as categorias e cantigas do Firebase! Deseja continuar?')) {
        set(ref(db, '/'), null);
        alert('Banco Firebase resetado com sucesso.');
        navigateTo('home');
      }
    };

    /* ==========================================
       EVENT LISTENERS E INICIALIZAÇÃO
       ========================================== */
    document.addEventListener('DOMContentLoaded', () => {
      applySettings();

      // Menu Nav
      document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => {
          const page = item.dataset.page;
          navigateTo(page);
          document.getElementById('sidebar').classList.remove('open');
        });
      });

      // Mobile Menu
      document.getElementById('menuToggle').addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('open');
      });

      // Novo Ponto (Header)
      document.getElementById('btnNewCantiga').addEventListener('click', () => openModalCantiga());

      // Fechar Modais
      document.querySelectorAll('.close-modal').forEach(btn => {
        btn.addEventListener('click', () => {
          modalCategory.classList.remove('active');
          modalCantiga.classList.remove('active');
        });
      });

      // Busca Global
      document.getElementById('globalSearch').addEventListener('input', (e) => {
        state.searchTerm = e.target.value;
        render();
      });
    });
  </script>
</body>
</html>
