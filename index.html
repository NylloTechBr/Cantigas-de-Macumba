<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cantigas de Macumba</title>
  
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ==========================================
       VARIÁVEIS E TEMAS
       ========================================== */
    :root {
      --bg-dark: #0f0d0e;
      --bg-card: #181517;
      --bg-sidebar: #141113;
      --gold-primary: #d4af37;
      --gold-hover: #f3e5ab;
      --red-dark: #7a0010;
      --red-hover: #9e0015;
      --text-white: #f5f5f7;
      --text-muted: #a1a1aa;
      --border-color: #27272a;
      --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --font-title: 'Cinzel', serif;
      --font-body: 'Inter', sans-serif;
      --base-font-size: 16px;
      --lyric-font-size: 1.25rem;
    }

    [data-theme="light"] {
      --bg-dark: #f8f9fa;
      --bg-card: #ffffff;
      --bg-sidebar: #f1f3f5;
      --text-white: #1a1a1a;
      --text-muted: #6c757d;
      --border-color: #dee2e6;
      --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
    }

    /* RESET & BASE */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: var(--base-font-size);
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: var(--font-body);
      display: flex;
      height: 100vh;
      overflow: hidden;
      transition: var(--transition);
    }

    button, input, select, textarea {
      font-family: inherit;
      color: inherit;
      outline: none;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-dark);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--gold-primary);
    }

    /* LAYOUT PRINCIPAL */
    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Sidebar Overlay (Mobile) */
    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(2px);
      z-index: 99;
      transition: var(--transition);
    }

    .sidebar-overlay.active {
      display: block;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: var(--transition);
      z-index: 100;
      flex-shrink: 0;
    }

    .brand {
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand i {
      color: var(--gold-primary);
      font-size: 1.8rem;
    }

    .brand h1 {
      font-family: var(--font-title);
      font-size: 1.1rem;
      color: var(--gold-primary);
      letter-spacing: 1px;
    }

    .nav-menu {
      list-style: none;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      overflow-y: auto;
    }

    .nav-section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 1px;
      margin: 12px 12px 4px 12px;
      font-weight: 700;
    }

    .nav-item button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-radius: 8px;
      color: var(--text-muted);
      font-weight: 500;
      transition: var(--transition);
    }

    .nav-item button:hover,
    .nav-item.active button {
      background-color: rgba(212, 175, 55, 0.1);
      color: var(--gold-primary);
    }

    .nav-item.active button {
      border-left: 3px solid var(--gold-primary);
    }

    /* Status do Firebase na Sidebar */
    .cloud-status {
      padding: 16px;
      border-top: 1px solid var(--border-color);
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #2e7d32;
    }

    /* Header & Main Area */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    .header {
      height: 70px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background-color: var(--bg-sidebar);
      gap: 12px;
    }

    .left-header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-toggle {
      display: none;
      font-size: 1.4rem;
      color: var(--text-white);
      padding: 8px;
    }

    .search-bar {
      position: relative;
      width: 320px;
      max-width: 100%;
    }

    .search-bar input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      background-color: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      color: var(--text-white);
      transition: var(--transition);
    }

    .search-bar input:focus {
      border-color: var(--gold-primary);
    }

    .search-bar i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .main-content {
      flex: 1;
      padding: 28px;
      overflow-y: auto;
      background-color: var(--bg-dark);
    }

    /* COMPONENTES REUTILIZÁVEIS */
    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: var(--transition);
      white-space: nowrap;
    }

    .btn-primary {
      background-color: var(--gold-primary);
      color: #000;
    }
    .btn-primary:hover {
      background-color: var(--gold-hover);
      transform: translateY(-2px);
    }

    .btn-danger {
      background-color: var(--red-dark);
      color: #fff;
    }
    .btn-danger:hover {
      background-color: var(--red-hover);
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-white);
    }
    .btn-secondary:hover {
      background-color: var(--border-color);
    }

    .page-title {
      font-family: var(--font-title);
      font-size: 1.6rem;
      color: var(--gold-primary);
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    /* Cards */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--card-shadow);
      border-color: rgba(212, 175, 55, 0.4);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .card-subtitle {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .tag {
      background-color: rgba(212, 175, 55, 0.15);
      color: var(--gold-primary);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    /* FORMULÁRIOS DAS ABAS DEDICADAS */
    .form-container {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 28px;
      max-width: 700px;
      margin: 0 auto;
      box-shadow: var(--card-shadow);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
    }

    .form-control {
      width: 100%;
      padding: 12px 16px;
      background-color: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-white);
      transition: var(--transition);
    }

    .form-control:focus {
      border-color: var(--gold-primary);
    }

    textarea.form-control {
      min-height: 180px;
      resize: vertical;
    }

    /* ESTATÍSTICAS */
    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .stat-icon {
      font-size: 2rem;
      color: var(--gold-primary);
    }

    .stat-val {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* VISUALIZADOR DE CANTIGA COM LEITURA MELHORADA */
    .cantiga-view {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 32px;
      max-width: 800px;
      margin: 0 auto;
      transition: var(--transition);
    }

    .cantiga-view.focus-mode {
      background-color: #050505;
      border-color: var(--gold-primary);
      padding: 40px;
    }

    .cantiga-controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--bg-dark);
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .font-size-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cantiga-lyric {
      font-size: var(--lyric-font-size);
      line-height: 1.9;
      letter-spacing: 0.3px;
      white-space: pre-wrap;
      margin: 20px 0;
      padding: 24px;
      background-color: var(--bg-dark);
      border-radius: 12px;
      border-left: 5px solid var(--gold-primary);
      font-weight: 400;
    }

    /* IMPRESSÃO / EXPORTAÇÃO PDF */
    #print-section {
      display: none;
    }

    @media print {
      body {
        background: #ffffff !important;
        color: #000000 !important;
        height: auto !important;
        overflow: visible !important;
      }

      .app-container {
        display: none !important;
      }

      #print-section {
        display: block !important;
        position: static !important;
        width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
        background: #ffffff !important;
        color: #000000 !important;
      }

      .pdf-cantiga-item {
        page-break-inside: avoid;
        break-inside: avoid;
        margin-bottom: 24px;
        border-bottom: 1px solid #ccc;
        padding-bottom: 16px;
      }

      .pdf-cantiga-title {
        font-size: 1.3rem;
        font-weight: bold;
        color: #000000;
        margin-bottom: 6px;
      }

      .pdf-cantiga-lyrics {
        white-space: pre-wrap;
        font-size: 1.05rem;
        line-height: 1.6;
        color: #111111;
        font-family: inherit;
      }
    }

    /* RESPONSIVIDADE E AJUSTES MOBILE */
    @media (max-width: 820px) {
      .sidebar {
        position: fixed;
        left: -270px;
        top: 0;
        height: 100vh;
        box-shadow: 4px 0 16px rgba(0, 0, 0, 0.4);
      }
      .sidebar.open {
        left: 0;
      }
      .menu-toggle {
        display: block;
      }
      .header {
        padding: 0 16px;
      }
      .search-bar {
        width: 100%;
      }
      .main-content {
        padding: 16px;
      }
      .grid-cards {
        grid-template-columns: 1fr;
      }
      .cantiga-view {
        padding: 20px;
      }
      .cantiga-lyric {
        padding: 16px;
      }
      .form-container {
        padding: 20px;
      }
      .btn-text-mobile-hide {
        display: none;
      }
    }

    @media (max-width: 480px) {
      .page-title {
        font-size: 1.3rem;
      }
      .header-actions .btn {
        padding: 8px 12px;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- OVERLAY PARA MOBILE -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <i class="fa-solid fa-fire-flame-curved"></i>
        <h1>Cantigas de Macumba</h1>
      </div>
      <ul class="nav-menu">
        <div class="nav-section-title">Navegação</div>
        <li class="nav-item active" data-page="home">
          <button><i class="fa-solid fa-house"></i> Início</button>
        </li>
        <li class="nav-item" data-page="categories">
          <button><i class="fa-solid fa-layer-group"></i> Categorias</button>
        </li>
        <li class="nav-item" data-page="favorites">
          <button><i class="fa-solid fa-star"></i> Favoritos</button>
        </li>
        <li class="nav-item" data-page="recents">
          <button><i class="fa-solid fa-clock"></i> Recentes</button>
        </li>

        <div class="nav-section-title">Ações Rápidas</div>
        <li class="nav-item" data-page="add-cantiga">
          <button><i class="fa-solid fa-plus-circle" style="color: var(--gold-primary);"></i> Criar Ponto</button>
        </li>
        <li class="nav-item" data-page="add-category">
          <button><i class="fa-solid fa-folder-plus" style="color: var(--gold-primary);"></i> Criar Categoria</button>
        </li>

        <div class="nav-section-title">Sistema</div>
        <li class="nav-item" data-page="backup">
          <button><i class="fa-solid fa-database"></i> Backup</button>
        </li>
        <li class="nav-item" data-page="settings">
          <button><i class="fa-solid fa-gear"></i> Configurações</button>
        </li>
      </ul>
      <div class="cloud-status">
        <div class="status-dot"></div>
        <span>Nyllo Tech 2026</span>
      </div>
    </aside>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
      <!-- HEADER -->
      <header class="header">
        <div class="left-header-controls">
          <button class="menu-toggle" id="menuToggle" aria-label="Abrir Menu"><i class="fa-solid fa-bars"></i></button>
          <button class="btn btn-secondary" id="globalBackBtn" onclick="window.goBack()" style="display: none;" title="Voltar para a página anterior">
            <i class="fa-solid fa-arrow-left"></i> <span class="btn-text-mobile-hide">Voltar</span>
          </button>
        </div>
        <div class="search-bar">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="globalSearch" placeholder="Pesquisar ponto, letra ou tag...">
        </div>
        <div class="header-actions">
          <button class="btn btn-primary" onclick="window.navigateTo('add-cantiga')">
            <i class="fa-solid fa-plus"></i> <span class="btn-text-mobile-hide">Novo Ponto</span>
          </button>
        </div>
      </header>

      <!-- MAIN CONTENT AREA -->
      <main class="main-content" id="mainContent">
        <p style="color: var(--text-muted); text-align: center; margin-top: 40px;">Carregando dados do Firebase Realtime...</p>
      </main>
    </div>
  </div>

  <!-- AREA RESERVADA PARA IMPRESSÃO / GERAR PDF -->
  <div id="print-section"></div>

  <!-- FIREBASE IMPORTS (MÓDULOS ESM) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, remove, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Configuração do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAAW59AXhb8N6sJMXxuExF1sfuoxLa6As4",
      authDomain: "meu-escritorio-8c82e.firebaseapp.com",
      databaseURL: "https://meu-escritorio-8c82e-default-rtdb.firebaseio.com",
      projectId: "meu-escritorio-8c82e",
      storageBucket: "meu-escritorio-8c82e.firebasestorage.app",
      messagingSenderId: "684347838633",
      appId: "1:684347838633:web:2d92465d0a37ea185b19b8"
    };

    // Inicialização do Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    /* ==========================================
       ESTADO GLOBAL DA APLICAÇÃO
       ========================================== */
    let state = {
      categories: [],
      cantigas: [],
      settings: JSON.parse(localStorage.getItem('umbanda_settings')) || { theme: 'dark', fontSize: '16px', mainColor: '#d4af37' },
      currentPage: 'home',
      currentCategoryFilter: null,
      currentCantigaId: null,
      editingCantigaId: null,
      editingCategoryId: null,
      searchTerm: '',
      lyricFontSizeRem: 1.25,
      isFocusMode: false
    };

    // Pilha de navegação (Histórico robusto)
    let pageHistory = [];

    /* ==========================================
       CONEXÃO EM TEMPO REAL (FIREBASE LISTENERS)
       ========================================== */
    const categoriesRef = ref(db, 'categories');
    const cantigasRef = ref(db, 'cantigas');

    onValue(categoriesRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        state.categories = Object.keys(data).map(key => ({
          id: key,
          name: data[key].name || '',
          parentId: data[key].parentId || null,
          icon: data[key].icon || 'fa-fire',
          color: data[key].color || '#d4af37'
        }));
      } else {
        state.categories = [];
      }
      render();
    });

    onValue(cantigasRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        state.cantigas = Object.keys(data).map(key => ({ id: key, ...data[key] }));
      } else {
        state.cantigas = [];
      }
      render();
    });

    /* ==========================================
       UTILITÁRIOS & CONFIGURAÇÕES
       ========================================== */
    function applySettings() {
      document.body.setAttribute('data-theme', state.settings.theme);
      document.documentElement.style.setProperty('--base-font-size', state.settings.fontSize);
      document.documentElement.style.setProperty('--lyric-font-size', `${state.lyricFontSizeRem}rem`);
      if (state.settings.mainColor) {
        document.documentElement.style.setProperty('--gold-primary', state.settings.mainColor);
      }
      localStorage.setItem('umbanda_settings', JSON.stringify(state.settings));
    }

    function formatDate(isoString) {
      if(!isoString) return '';
      const date = new Date(isoString);
      return date.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function getCantigaCategoryName(catId) {
      const cat = state.categories.find(c => c.id === catId);
      if(!cat) return 'Sem Categoria';
      if(cat.parentId) {
        const parent = state.categories.find(c => c.id === cat.parentId);
        return parent ? `${parent.name} / ${cat.name}` : cat.name;
      }
      return cat.name;
    }

    /* ==========================================
       NAVEGAÇÃO E RENDERIZAÇÃO
       ========================================== */
    window.navigateTo = function(page, categoryId = null, recordHistory = true) {
      // Registrar no histórico se for navegação normal
      if (recordHistory && (state.currentPage !== page || state.currentCategoryFilter !== categoryId)) {
        pageHistory.push({
          page: state.currentPage,
          categoryId: state.currentCategoryFilter,
          cantigaId: state.currentCantigaId
        });
      }

      state.currentPage = page;
      if (categoryId !== null || (page !== 'add-cantiga' && page !== 'add-category')) {
        state.currentCategoryFilter = categoryId;
      }

      if(page !== 'add-cantiga') state.editingCantigaId = null;
      if(page !== 'add-category') state.editingCategoryId = null;

      document.querySelectorAll('.nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.page === page);
      });

      // Se for para outra página, sai do Modo Foco
      if (page !== 'view-cantiga') {
        state.isFocusMode = false;
      }

      closeMobileMenu();
      render();
    };

    window.goBack = function() {
      if (pageHistory.length > 0) {
        const previousState = pageHistory.pop();
        state.currentCantigaId = previousState.cantigaId;
        window.navigateTo(previousState.page, previousState.categoryId, false);
      } else {
        window.navigateTo('home', null, false);
      }
    };

    function closeMobileMenu() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').classList.remove('active');
    }

    const mainContent = document.getElementById('mainContent');

    function render() {
      applySettings();

      const globalBackBtn = document.getElementById('globalBackBtn');
      if (globalBackBtn) {
        if (pageHistory.length > 0 || state.currentPage !== 'home') {
          globalBackBtn.style.display = 'inline-flex';
        } else {
          globalBackBtn.style.display = 'none';
        }
      }

      if (state.searchTerm.trim() !== '') {
        renderSearchResults();
        return;
      }

      switch (state.currentPage) {
        case 'home': renderHome(); break;
        case 'categories': renderCategories(); break;
        case 'category-detail': renderCategoryDetail(state.currentCategoryFilter); break;
        case 'favorites': renderFavorites(); break;
        case 'recents': renderRecents(); break;
        case 'add-cantiga': renderAddCantiga(); break;
        case 'add-category': renderAddCategory(); break;
        case 'backup': renderBackup(); break;
        case 'settings': renderSettings(); break;
        case 'view-cantiga': renderCantigaView(state.currentCantigaId); break;
        default: renderHome();
      }
    }

    // --- HOME ---

      const totalCategories = state.categories.length;
      const totalCantigas = state.cantigas.length;
      const lastCantiga = state.cantigas.length > 0 
        ? [...state.cantigas].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt))[0] 
        : null;

      const mainCategories = state.categories.filter(c => !c.parentId);

      mainContent.innerHTML = `

          <h2>Início</h2>
          <button class="btn btn-primary" onclick="window.navigateTo('add-category')"><i class="fa-solid fa-folder-plus"></i> Nova Categoria</button>
        </div>

        <div class="stats-container">
          <div class="stat-card">
            <i class="fa-solid fa-layer-group stat-icon"></i>

              <div class="stat-val">${totalCategories}</div>
              <div class="stat-label">Categorias / Subcategorias</div>
            </div>
          </div>

            <i class="fa-solid fa-music stat-icon"></i>

              <div class="stat-label">Cantigas Registradas</div>

        <div class="grid-cards">
          ${mainCategories.map(cat => renderCategoryCardHtml(cat)).join('')}
        </div>
      `;
    }

    // --- CATEGORIAS ---
    function renderCategories() {
      const mainCategories = state.categories.filter(c => !c.parentId);

      mainContent.innerHTML = `
        <div class="page-title">
          <h2>Categorias</h2>
          <button class="btn btn-primary" onclick="window.navigateTo('add-category')">
            <i class="fa-solid fa-plus"></i> Nova Categoria
          </button>

        ${mainCategories.length === 0 ? '<p style="color: var(--text-muted);">Nenhuma categoria cadastrada.</p>' : ''}
        <div class="grid-cards">
          ${mainCategories.map(cat => renderCategoryCardHtml(cat)).join('')}
        </div>
      `;
    }

    function renderCategoryCardHtml(cat) {
      const subCatIds = state.categories.filter(c => c.parentId === cat.id).map(c => c.id);
      const allCatIds = [cat.id, ...subCatIds];
      const count = state.cantigas.filter(c => allCatIds.includes(c.categoryId)).length;
      const subCount = subCatIds.length;

      return `
        <div class="card" onclick="window.navigateTo('category-detail', '${cat.id}')">
          <div>
            <div class="card-header">
              <div class="card-icon" style="background-color: ${cat.color}20; color: ${cat.color};">
                <i class="fa-solid ${cat.icon}"></i>
              </div>
              <div onclick="event.stopPropagation();">
                <button onclick="window.editCategory('${cat.id}')" style="color: var(--text-muted); margin-right: 8px;" title="Editar"><i class="fa-solid fa-pen"></i></button>
                <button onclick="window.deleteCategory('${cat.id}')" style="color: var(--red-dark);" title="Excluir"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>
            <div class="card-title">${cat.name}</div>
            <div class="card-subtitle">
              ${count} cantigas ${subCount > 0 ? `• ${subCount} subcategorias` : ''}
            </div>
          </div>
        </div>
      `;
    }

    // --- DETALHE DA CATEGORIA ---
    function renderCategoryDetail(catId) {
      const category = state.categories.find(c => c.id === catId);
      if(!category) return window.navigateTo('categories');

      const subcategories = state.categories.filter(c => c.parentId === catId);
      const subCatIds = subcategories.map(c => c.id);

      const allCategoryIds = [catId, ...subCatIds];
      const cantigas = state.cantigas.filter(c => allCategoryIds.includes(c.categoryId));

      mainContent.innerHTML = `
        <div class="page-title">
          <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
            <i class="fa-solid ${category.icon}" style="color: ${category.color}; font-size: 1.5rem;"></i>
            <h2>${category.name}</h2>
          </div>
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn btn-secondary" onclick="window.exportCategoryToPDF('${catId}')"><i class="fa-solid fa-file-pdf"></i> PDF</button>
            <button class="btn btn-secondary" onclick="window.navigateTo('add-category', '${catId}')"><i class="fa-solid fa-folder-plus"></i>Subcategoria</button>
            <button class="btn btn-primary" onclick="window.navigateTo('add-cantiga', '${catId}')"><i class="fa-solid fa-plus"></i>Ponto</button>
          </div>
        </div>

        ${subcategories.length > 0 ? `
          <h3 style="margin-bottom: 16px; font-family: var(--font-title); color: var(--gold-primary);">Subcategorias</h3>

            ${subcategories.map(sc => renderCategoryCardHtml(sc)).join('')}

        ` : ''}
        
        <h3 style="margin-bottom: 16px; font-family: var(--font-title); color: var(--gold-primary);">Pontos em ${category.name}</h3>

        <div class="grid-cards">
          ${cantigas.map(c => renderCantigaCardHtml(c)).join('')}

      `;
    }

    function renderCantigaCardHtml(cantiga) {
      const isFav = cantiga.favorite;
      return `
        <div class="card" onclick="window.viewCantiga('${cantiga.id}')">
          <div>
            <div class="card-header">

    /* ==========================================
       ABA DEDICADA: CRIAR / EDITAR PONTO
       ========================================== */
    function renderAddCantiga() {
      const cantigaToEdit = state.editingCantigaId ? state.cantigas.find(c => c.id === state.editingCantigaId) : null;
      const targetCategoryId = cantigaToEdit ? cantigaToEdit.categoryId : state.currentCategoryFilter;

      mainContent.innerHTML = `
        <div class="page-title">
          <h2>${cantigaToEdit ? 'Editar Ponto' : 'Criar Novo Ponto'}</h2>
        </div>
        <div class="form-container">
          <form id="standaloneFormCantiga">
            <div class="form-group">
              <label>Título do Ponto</label>
              <input type="text" id="cTitle" class="form-control" required placeholder="Ex: Ponto de Ogum Beira-Mar" value="${cantigaToEdit ? cantigaToEdit.title : ''}">
            </div>

            <div class="form-group">
              <label>Categoria / Subcategoria</label>
              <select id="cCategory" class="form-control" required>
                ${state.categories.length === 0 ? '<option value="">Nenhuma categoria encontrada - crie uma primeiro</option>' : ''}
                ${state.categories.map(c => `<option value="${c.id}" ${targetCategoryId === c.id ? 'selected' : ''}>${getCantigaCategoryName(c.id)}</option>`).join('')}
              </select>
            </div>

            <div class="form-group">
              <label>Tags (separadas por vírgula)</label>
              <input type="text" id="cTags" class="form-control" placeholder="Ex: Proteção, Abertura, Demanda" value="${cantigaToEdit && cantigaToEdit.tags ? cantigaToEdit.tags.join(', ') : ''}">
            </div>

            <div class="form-group">
              <label>Letra da Cantiga</label>
              <textarea id="cLyrics" class="form-control" required placeholder="Digite a letra completa da cantiga aqui...">${cantigaToEdit ? cantigaToEdit.lyrics : ''}</textarea>
            </div>

            <div class="form-group">
              <label>Observações / Autor (Opcional)</label>
              <input type="text" id="cNotes" class="form-control" placeholder="Ex: Toque: Nagô / Autor: Desconhecido" value="${cantigaToEdit && cantigaToEdit.notes ? cantigaToEdit.notes : ''}">
            </div>

            <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 28px;">
              <button type="button" class="btn btn-secondary" onclick="window.goBack()">Cancelar</button>
              <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Salvar Ponto</button>
            </div>
          </form>
        </div>
      `;

      setTimeout(() => {
        const form = document.getElementById('standaloneFormCantiga');
        if (form) {
          form.onsubmit = (e) => {
            e.preventDefault();
            const title = document.getElementById('cTitle').value;
            const categoryId = document.getElementById('cCategory').value;
            const tagsStr = document.getElementById('cTags').value;
            const lyrics = document.getElementById('cLyrics').value;
            const notes = document.getElementById('cNotes').value;

            if(!categoryId) {
              alert('Crie ao menos uma categoria antes de adicionar um ponto.');
              return;
            }

            const tags = tagsStr ? tagsStr.split(',').map(t => t.trim()).filter(t => t !== '') : [];

            if (state.editingCantigaId) {
              update(ref(db, `cantigas/${state.editingCantigaId}`), {
                title, categoryId, tags, lyrics, notes, updatedAt: new Date().toISOString()
              });
              alert('Ponto atualizado com sucesso!');
            } else {
              const newRef = push(ref(db, 'cantigas'));
              set(newRef, {
                title, categoryId, tags, lyrics, notes, favorite: false, createdAt: new Date().toISOString()
              });
              alert('Ponto salvo com sucesso!');
            }

            state.editingCantigaId = null;
            window.goBack();
          };
        }
      }, 0);
    }

      state.lyricFontSizeRem = Math.max(0.9, Math.min(2.5, state.lyricFontSizeRem + delta));
      applySettings();
    };

    window.resetLyricFontSize = function() {
      state.lyricFontSizeRem = 1.25;
      applySettings();
    };

    window.toggleFocusMode = function() {
      state.isFocusMode = !state.isFocusMode;
      render();

    // --- PESQUISA ---
    function renderSearchResults() {
      const term = state.searchTerm.toLowerCase();
      const results = state.cantigas.filter(c => 
        c.title.toLowerCase().includes(term) || 
        c.lyrics.toLowerCase().includes(term) ||
        (c.tags && c.tags.some(t => t.toLowerCase().includes(term)))
      );

      mainContent.innerHTML = `
        <div class="page-title">
          <h2>Resultados da Busca ("${state.searchTerm}")</h2>
        </div>
        ${results.length === 0 ? '<p style="color: var(--text-muted);">Nenhum ponto encontrado para este termo.</p>' : ''}
        <div class="grid-cards">
          ${results.map(c => renderCantigaCardHtml(c)).join('')}
        </div>
      `;
    }

    // --- BACKUP E CONFIGURAÇÕES ---
    function renderBackup() {
      mainContent.innerHTML = `
        <div class="page-title"><h2>Backup e Restauração</h2></div>
        <div class="cantiga-view">
          <p style="margin-bottom: 20px; color: var(--text-muted);">Baixe uma cópia de segurança do Firebase ou restaure dados através de um arquivo JSON.</p>
          <div style="display:flex; flex-direction:column; gap: 16px;">
            <div>
              <h3>Exportar Dados (JSON)</h3>
              <p style="font-size:0.85rem; color: var(--text-muted); margin-bottom: 8px;">Baixe um arquivo JSON contendo todas as suas categorias e cantigas do banco em nuvem.</p>
              <button class="btn btn-primary" onclick="window.exportData()"><i class="fa-solid fa-download"></i> Baixar Backup JSON</button>
            </div>
            <hr style="border-color: var(--border-color);">
            <div>
              <h3>Importar Dados (JSON)</h3>
              <p style="font-size:0.85rem; color: var(--text-muted); margin-bottom: 8px;">Importe um arquivo JSON para enviar dados em massa ao seu Firebase Realtime Database.</p>
              <input type="file" id="importFile" accept=".json" style="display:none;">
              <button class="btn btn-secondary" id="btnTriggerImport"><i class="fa-solid fa-upload"></i> Selecionar Arquivo JSON</button>
            </div>
          </div>
        </div>
      `;

      setTimeout(() => {
        const triggerBtn = document.getElementById('btnTriggerImport');
        const fileInput = document.getElementById('importFile');
        if (triggerBtn && fileInput) {
          triggerBtn.onclick = () => fileInput.click();
          fileInput.onchange = importData;
        }
      }, 0);
    }

    function renderSettings() {
      mainContent.innerHTML = `
        <div class="page-title"><h2>Configurações do Sistema</h2></div>
        <div class="cantiga-view">
          <div class="form-group">
            <label>Tema Visual</label>
            <select class="form-control" id="themeSelect">
              <option value="dark" ${state.settings.theme === 'dark' ? 'selected' : ''}>Modo Escuro (Padrão)</option>
              <option value="light" ${state.settings.theme === 'light' ? 'selected' : ''}>Modo Claro</option>
            </select>
          </div>
          <div class="form-group">
            <label>Tamanho Padrão da Interface</label>
            <select class="form-control" id="fontSizeSelect">
              <option value="14px" ${state.settings.fontSize === '14px' ? 'selected' : ''}>Pequena</option>
              <option value="16px" ${state.settings.fontSize === '16px' ? 'selected' : ''}>Média (Padrão)</option>
              <option value="18px" ${state.settings.fontSize === '18px' ? 'selected' : ''}>Grande</option>
            </select>
          </div>
          <div class="form-group">
            <label>Cor Principal de Destaque</label>
            <input type="color" class="form-control" id="colorPicker" value="${state.settings.mainColor || '#d4af37'}" style="height: 40px; padding:2px;">
          </div>
          <hr style="border-color: var(--border-color); margin: 24px 0;">
          <div style="border: 1px solid var(--red-dark); padding: 16px; border-radius: 8px; background-color: rgba(122, 0, 16, 0.1);">
            <h4 style="color: var(--red-hover); margin-bottom: 8px;">Zona de Perigo</h4>
            <p style="font-size:0.85rem; color: var(--text-muted); margin-bottom: 12px;">Esta ação limpa permanentemente todos os dados armazenados no banco de dados Firebase.</p>
            <button class="btn btn-danger" onclick="window.clearAllData()"><i class="fa-solid fa-triangle-exclamation"></i> Limpar Banco Firebase</button>
          </div>
        </div>
      `;

      setTimeout(() => {
        document.getElementById('themeSelect').addEventListener('change', (e) => updateSetting('theme', e.target.value));
        document.getElementById('fontSizeSelect').addEventListener('change', (e) => updateSetting('fontSize', e.target.value));
        document.getElementById('colorPicker').addEventListener('change', (e) => updateSetting('mainColor', e.target.value));
      }, 0);
    }

    /* ==========================================
       OPERAÇÕES FIREBASE (CRUD) & PDF
       ========================================== */
    window.editCategory = function(id) {
      state.editingCategoryId = id;
      window.navigateTo('add-category');
    };
    
    window.deleteCategory = function(id) {
      if(confirm('Tem certeza? Isso excluirá a categoria do Firebase.')) {
        remove(ref(db, `categories/${id}`));
      }
    };

    window.editCantiga = function(id) {
      state.editingCantigaId = id;
      window.navigateTo('add-cantiga');
    };
    
    window.deleteCantiga = function(id) {
      if(confirm('Tem certeza que deseja excluir esta cantiga do Firebase?')) {
        remove(ref(db, `cantigas/${id}`));
        if(state.currentPage === 'view-cantiga') window.goBack();
      }
    };

    window.duplicateCantiga = function(id) {
      const item = state.cantigas.find(c => c.id === id);
      if(item) {
        const newRef = push(ref(db, 'cantigas'));
        set(newRef, {
          title: `${item.title} (Cópia)`,
          categoryId: item.categoryId,
          tags: item.tags || [],
          lyrics: item.lyrics,
          notes: item.notes || '',
          favorite: false,
          createdAt: new Date().toISOString()
        });
      }
    };

    window.toggleFavorite = function(id) {
      const cantiga = state.cantigas.find(c => c.id === id);
      if(cantiga) {
        update(ref(db, `cantigas/${id}`), { favorite: !cantiga.favorite });
      }
    };

    window.viewCantiga = function(id) {
      state.currentCantigaId = id;
      window.navigateTo('view-cantiga', state.currentCategoryFilter);
    };

    window.exportCategoryToPDF = function(catId) {
      const category = state.categories.find(c => c.id === catId);
      if(!category) return;

      const subCatIds = state.categories.filter(c => c.parentId === catId).map(c => c.id);
      const allCatIds = [catId, ...subCatIds];
      const cantigas = state.cantigas.filter(c => allCatIds.includes(c.categoryId));

      if(cantigas.length === 0) {
        alert("Não há cantigas nesta categoria para exportar.");
        return;
      }

      const printArea = document.getElementById('print-section');
      let html = `
        <div style="text-align: center; margin-bottom: 30px;">
          <h1 style="font-size: 2.2rem; margin-bottom: 5px; font-family: 'Cinzel', serif;">Templo de Umbanda Caboclo Ubirajara e Vovó Rita</h1>
          <h2 style="font-size: 1.5rem; color: #444;">Categoria: ${category.name}</h2>
          <p style="font-size: 0.9rem; color: #666;">Gerado em ${new Date().toLocaleDateString('pt-BR')}</p>
        </div>
        <hr style="margin-bottom: 24px; border: 0; border-top: 2px solid #333;">
      `;

      cantigas.forEach(c => {
        html += `
          <div class="pdf-cantiga-item">
            <div class="pdf-cantiga-title">${c.title} <span style="font-size: 0.85rem; font-weight: normal; color: #555;">(${getCantigaCategoryName(c.categoryId)})</span></div>
            <div class="pdf-cantiga-lyrics">${c.lyrics}</div>
            ${c.notes ? `<div style="font-style: italic; font-size: 0.85rem; color: #555; margin-top: 8px;">Obs: ${c.notes}</div>` : ''}
          </div>
        `;
      });

      printArea.innerHTML = html;
      window.print();
    };

    window.copyToClipboard = function(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert('Letra copiada para a área de transferência!');
      });
    };

    window.printCantiga = function(id) {
      const cantiga = state.cantigas.find(c => c.id === id);
      if(!cantiga) return;

      const printArea = document.getElementById('print-section');
      printArea.innerHTML = `
        <div style="margin-bottom: 20px;">
          <h1 style="font-size: 1.8rem; margin-bottom: 4px;">${cantiga.title}</h1>
          <p style="color: #555;"><strong>Categoria:</strong> ${getCantigaCategoryName(cantiga.categoryId)}</p>
        </div>
        <hr style="margin: 12px 0;">
        <div class="pdf-cantiga-lyrics">${cantiga.lyrics}</div>
        ${cantiga.notes ? `<p style="margin-top: 12px; font-style: italic; color: #555;">Obs: ${cantiga.notes}</p>` : ''}
      `;
      window.print();
    };

    window.shareCantiga = function(id) {
      const cantiga = state.cantigas.find(c => c.id === id);
      if(navigator.share && cantiga) {
        navigator.share({
          title: cantiga.title,
          text: `${cantiga.title}\n\n${cantiga.lyrics}`
        }).catch(() => {});
      } else {
        window.copyToClipboard(`${cantiga.title}\n\n${cantiga.lyrics}`);
      }
    };

    window.exportData = function() {
      const exportObject = { categories: state.categories, cantigas: state.cantigas };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObject, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `firebase_cancioneiro_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    };

    function importData(event) {
      const file = event.target.files[0];
      if(!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if(imported.categories && imported.cantigas) {
            imported.categories.forEach(cat => {
              const catRef = ref(db, `categories/${cat.id || push(ref(db, 'categories')).key}`);
              set(catRef, { name: cat.name, parentId: cat.parentId || null, icon: cat.icon, color: cat.color });
            });

            imported.cantigas.forEach(cant => {
              const cantRef = ref(db, `cantigas/${cant.id || push(ref(db, 'cantigas')).key}`);
              set(cantRef, {
                title: cant.title,
                categoryId: cant.categoryId,
                tags: cant.tags || [],
                lyrics: cant.lyrics,
                notes: cant.notes || '',
                favorite: !!cant.favorite,
                createdAt: cant.createdAt || new Date().toISOString()
              });
            });

            alert('Dados importados com sucesso!');
            window.navigateTo('home');
          } else {
            alert('Arquivo JSON com estrutura inválida.');
          }
        } catch(err) {
          alert('Erro ao processar o arquivo JSON.');
        }
      };
      reader.readAsText(file);
    }

    function updateSetting(key, val) {
      state.settings[key] = val;
      applySettings();
    }

    window.clearAllData = function() {
      if(confirm('ATENÇÃO: Esta ação apaga permanentemente TODAS as categorias e cantigas do Firebase! Deseja continuar?')) {
        set(ref(db, '/'), null);
        alert('Banco Firebase resetado com sucesso.');
        window.navigateTo('home');
      }
    };

    /* ==========================================
       EVENT LISTENERS E INICIALIZAÇÃO
       ========================================== */
    document.addEventListener('DOMContentLoaded', () => {
      applySettings();

      document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => {
          const page = item.dataset.page;
          window.navigateTo(page);
        });
      });

      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');

      document.getElementById('menuToggle').addEventListener('click', () => {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('active');
      });

      overlay.addEventListener('click', closeMobileMenu);

      document.getElementById('globalSearch').addEventListener('input', (e) => {
        state.searchTerm = e.target.value;
        render();
      });
    });
  </script>
</body>
</html>
